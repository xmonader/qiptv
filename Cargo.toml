[package]
name = "kiptv"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.29"
egui = "0.29"
rfd = "0.15"
zbus = { version = "5", features = ["tokio"] }
gstreamer = "0.23"
quick-xml = { version = "0.36", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
regex = "1"
